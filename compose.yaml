services:
  api:
    build: .
    image: odbc-api
    container_name: odbc-api

    environment:
      APP_PORT: 8080
      DB_DRIVER: "PostgreSQL"
      DB_SERVER: "localhost"
      DB_DATABASE: "postgres"
      DB_USERNAME: "postgres"
      DB_PASSWORD: "${PG_PASSWORD}"

    ports:
      - "80:8080"